# toda fuente que use el motor o la web debe estar aquí. La web las muestra todas.
fuentes:
  - id: modis_mod13q1
    nombre: "MODIS/Terra MOD13Q1 v061: índice de vegetación (NDVI) de 16 días a 250 m"
    cita: "Didan, K. (2021). MODIS/Terra Vegetation Indices 16-Day L3 Global 250m SIN Grid V061. NASA EOSDIS Land Processes DAAC. doi:10.5067/MODIS/MOD13Q1.061. Terra empieza a apagarse entre finales de 2026 y principios de 2027 («earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs»): el histórico sigue válido y el método pasa a los índices de vegetación de VIIRS."
    en: {nombre: "MODIS/Terra MOD13Q1 v061: vegetation index (NDVI) every 16 days at 250 m", resolucion: "250 m, 16 days", cita: "Didan, K. (2021). MODIS/Terra Vegetation Indices 16-Day L3 Global 250m SIN Grid V061. NASA EOSDIS Land Processes DAAC. doi:10.5067/MODIS/MOD13Q1.061. Terra begins to shut down between late 2026 and early 2027 («earthdata.nasa.gov/data/alerts-outages/transition-from-modis-viirs»): the historical record stays valid and the method moves to the VIIRS vegetation indices."}
    url: "https://doi.org/10.5067/MODIS/MOD13Q1.061"
    resolucion: "250 m, 16 días"
    es_nasa: true

