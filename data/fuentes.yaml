  - id: chirps_diario
    nombre: "CHIRPS v3.0 diario 'sat': lluvia de junio a agosto para la canícula (no es NASA; usa NASA IMERG)"
    cita: "Climate Hazards Center, UC Santa Barbara. CHIRPS v3.0 diario, versión 'sat' (data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/sat/). Según su README, no es un producto diario independiente: reparte el total de cada péntada de CHIRPS con el reparto diario de NASA IMERG Late V07. El CHC advierte que las rachas secas pueden cambiar entre «sat» (IMERG) y «rnl» (ERA5) y pide probar con las dos; la rejilla de 0.05° no significa que IMERG tenga información a esa resolución. Cita de la versión 3.0: Funk, C., Peterson, P., Harrison, L. et al. (2026). The Climate Hazards Center Infrared Precipitation with Stations, Version 3. Scientific Data, 13, 718. doi:10.1038/s41597-026-07096-4 (indicada en data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/readme.txt, consultado el 14 nov 2026). Método base: Funk, C. et al. (2015), Scientific Data, 2, 150066. doi:10.1038/sdata.2015.66."
    en: {nombre: "CHIRPS v3.0 daily 'sat': June to August rain for the canícula (not NASA; uses NASA IMERG)", resolucion: "0.05° (~5 km), daily", cita: "Climate Hazards Center, UC Santa Barbara. CHIRPS v3.0 daily, 'sat' version (data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/final/sat/). According to its README, it is not an independent daily product: it splits each CHIRPS pentad total with the daily pattern of NASA IMERG Late V07. The CHC warns that dry spells can differ between 'sat' (IMERG) and 'rnl' (ERA5) and asks users to test with both; the 0.05° grid does not mean IMERG carries information at that resolution. Version 3.0 citation: Funk, C., Peterson, P., Harrison, L. et al. (2026). The Climate Hazards Center Infrared Precipitation with Stations, Version 3. Scientific Data, 13, 718. doi:10.1038/s41597-026-07096-4 (given in data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/readme.txt, read on 14 Nov 2026). Base method: Funk, C. et al. (2015), Scientific Data, 2, 150066. doi:10.1038/sdata.2015.66."}
    url: "https://data.chc.ucsb.edu/products/CHIRPS/v3.0/daily/"
    resolucion: "0.05° (~5 km), diario"
    es_nasa: false

