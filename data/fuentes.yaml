  - id: firms_viirs
    nombre: "FIRMS: focos de calor VIIRS S-NPP 375 m (archivo anual de Guatemala)"
    cita: "NASA FIRMS (Fire Information for Resource Management System). VIIRS (S-NPP) I Band 375 m Active Fire Product: procesamiento estándar VNP14IMG v002, doi:10.5067/VIIRS/VNP14IMG.002, y casi en tiempo real VNP14IMGT_NRT v2, doi:10.5067/FIRMS/VIIRS/VNP14IMGT_NRT.002. 2026 con MAP_KEY: estándar hasta el 31 jul y casi en tiempo real después. Cada foco es el centro de un píxel de unos 375 m (earthdata.nasa.gov/data/tools/firms/faq). Suomi NPP dejó de entregar datos nuevos a principios de noviembre de 2026 («earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026»); una actualización usaría VIIRS de NOAA-20 y NOAA-21. El hecho de quema solo usa enero-mayo, que en 2026 viene del producto estándar."
    en: {nombre: "FIRMS: VIIRS S-NPP 375 m fire detections (Guatemala yearly archive)", cita: "NASA FIRMS (Fire Information for Resource Management System). VIIRS (S-NPP) I Band 375 m Active Fire Product: standard processing VNP14IMG v002, doi:10.5067/VIIRS/VNP14IMG.002, and near real time VNP14IMGT_NRT v2, doi:10.5067/FIRMS/VIIRS/VNP14IMGT_NRT.002. 2026 with MAP_KEY: standard until 31 Jul and near real time after. Each detection is the center of a pixel of about 375 m (earthdata.nasa.gov/data/tools/firms/faq). Suomi NPP stopped delivering new data in early November 2026 («earthdata.nasa.gov/data/alerts-outages/suomi-npp-data-product-delivery-cease-november-1-2026»); an update would use VIIRS from NOAA-20 and NOAA-21. The burning fact only uses January-May, which in 2026 comes from the standard product."}
    url: "https://firms.modaps.eosdis.nasa.gov/country/"
    resolucion: "375 m"
    es_nasa: true

