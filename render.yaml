# Render Blueprint: free static site built from web/ (it does not sleep and needs no secrets).
# Deployed on 14 Nov 2026 as https://milpa-resiliente.onrender.com/. This file is the Render Blueprint of that static site
# (auto-sync on): a change pushed to main is applied to the service, and every push to main rebuilds it.
services:
  - type: web
    name: milpa-resiliente
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    pullRequestPreviewsEnabled: false
